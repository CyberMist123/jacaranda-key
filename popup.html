<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Jacaranda Key</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1c1c1e;
      --muted: #8a8a8e;
      --line: #ececef;
      --hover: #f5f5f7;
      --accent: #6a5acd;
      --accent-fg: #ffffff;
      --on: #34a853;
      --off: #c7c7cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --fg: #f2f2f7;
        --muted: #8e8e93;
        --line: #2c2c2e;
        --hover: #2a2a2d;
        --accent: #9d8fe6;
        --accent-fg: #1c1c1e;
        --off: #48484a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
    }
    header img { width: 18px; height: 18px; }
    header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.1px; }
    #lastRun { margin-left: auto; font-size: 11px; color: var(--muted); }

    section { padding: 0 16px; }
    .label {
      font-size: 11px;
      color: var(--muted);
      margin: 14px 0 4px;
    }

    .row {
      display: flex;
      align-items: center;
      height: 30px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--off);
      margin-right: 10px;
    }
    .row[data-on="1"] .dot { background: var(--on); }
    .row .state { margin-left: auto; color: var(--muted); font-size: 12px; }

    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .primary {
      width: 100%;
      height: 34px;
      margin-top: 14px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 500;
    }
    .primary:hover { filter: brightness(1.06); }
    .text-btn {
      display: block;
      margin: 8px auto 0;
      font-size: 12px;
      color: var(--muted);
    }
    .text-btn:hover { color: var(--fg); }

    .links { border-top: 1px solid var(--line); margin-top: 14px; padding: 6px 8px; }
    .link {
      display: flex;
      width: 100%;
      align-items: center;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      text-align: left;
    }
    .link:hover { background: var(--hover); }
    .link::after { content: "↗"; margin-left: auto; color: var(--muted); font-size: 11px; }
    .link small { color: var(--muted); font-size: 11px; margin-left: 6px; }

    footer {
      border-top: 1px solid var(--line);
      padding: 10px 16px 12px;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" />
    <h1>Jacaranda Key</h1>
    <span id="lastRun">检测中…</span>
  </header>

  <section>
    <div class="row" id="oktaRow"><span class="dot"></span>Okta<span class="state">—</span></div>
    <div class="row" id="canvasRow"><span class="dot"></span>Canvas<span class="state">—</span></div>
    <div class="row" id="proxyRow"><span class="dot"></span>图书馆代理页<span class="state">0 个</span></div>

    <button class="primary" id="proxyCurrentBtn">用图书馆代理打开当前页</button>
    <button class="text-btn" id="refreshNowBtn">立即续期</button>
  </section>

  <div class="links">
    <button class="link" data-url="https://sydney.primo.exlibrisgroup.com/view/action/uresolver.do?operation=resolveService&amp;package_service_id=68343842980005106&amp;institutionId=5106&amp;customerId=5105&amp;VE=true">Westlaw AU</button>
    <button class="link" data-url="https://go.openathens.net/redirector/sydney.edu.au?url=https%3A%2F%2Fglobal.factiva.com%2Fsb%2Fdefault.aspx%3Flnep%3Dhp">Factiva</button>
    <button class="link" data-url="https://sydney.primo.exlibrisgroup.com/discovery/search?vid=61USYD_INST:sydney">图书馆检索</button>
    <button class="link" data-url="https://canvas.sydney.edu.au/">Canvas</button>
  </div>

  <footer>不存储任何账号密码 · 非悉尼大学官方工具</footer>

  <script src="popup.js"></script>
</body>
</html>
