<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Jacaranda Key</title>
  <style>
    :root {
      --bg: linear-gradient(155deg, #f0f9ff 0%, #f5f3ff 52%, #faf5ff 100%);
      --bg-solid: #f5f3ff;
      --card: rgba(255, 255, 255, 0.86);
      --shadow: 0 4px 16px rgba(99, 102, 241, 0.08);
      --fg: #1e293b;
      --muted: #64748b;
      --soft: rgba(255, 255, 255, 0.86);
      --border: rgba(199, 210, 254, 0.7);
      --title: linear-gradient(120deg, #4f46e5, #9333ea);
      --btn: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --btn-shadow: 0 4px 12px rgba(99, 102, 241, 0.28);
      --accent: #6d28d9;
      --accent-fg: #ffffff;
      --accent-soft: #ede9fe;
      --ok: #16a34a;
      --off: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: linear-gradient(155deg, #10131c 0%, #15122a 55%, #1b1430 100%);
        --bg-solid: #15122a;
        --card: rgba(255, 255, 255, 0.06);
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        --fg: #eef0f6;
        --muted: #949bb0;
        --soft: rgba(255, 255, 255, 0.06);
        --border: rgba(165, 180, 252, 0.22);
        --title: linear-gradient(120deg, #a5b4fc, #d8b4fe);
        --btn: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        --btn-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        --accent: #c4b5fd;
        --accent-fg: #ffffff;
        --accent-soft: rgba(139, 92, 246, 0.18);
        --ok: #4ade80;
        --off: #475069;
      }
    }
    /* 彩蛋：吉良吉影紫绿撞色（深紫渐变底 + 亮绿） */
    body.kira {
      --bg: linear-gradient(155deg, #2b1257 0%, #3a1a6e 55%, #1d3b2c 100%);
      --bg-solid: #2b1257;
      --card: rgba(255, 255, 255, 0.08);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      --fg: #f4eeff;
      --muted: #bba9e8;
      --soft: rgba(255, 255, 255, 0.08);
      --border: rgba(125, 252, 159, 0.3);
      --title: linear-gradient(120deg, #7dfc9f, #c4f5d4);
      --btn: linear-gradient(135deg, #22c55e 0%, #7dfc9f 100%);
      --btn-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
      --accent: #7dfc9f;
      --accent-fg: #24104a;
      --accent-soft: rgba(125, 252, 159, 0.14);
      --ok: #7dfc9f;
      --off: #6b52a3;
    }

    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-solid); overflow-x: hidden; }
    body {
      width: 320px;
      padding: 16px;
      color: var(--fg);
      background: var(--bg);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    header img { width: 24px; height: 24px; border-radius: 6px; }
    #title {
      font-size: 15px;
      font-weight: 700;
      background: var(--title);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: default;
      user-select: none;
    }
    #lastRun { margin-left: auto; font-size: 11px; color: var(--muted); }
    .icon-btn { display: grid; place-items: center; width: 26px; height: 26px; margin-right: -4px; border-radius: 8px; color: var(--muted); }
    .icon-btn:hover { color: var(--accent); background: var(--accent-soft); }

    .settings-card { padding: 4px 14px 14px; }
    .label { padding-top: 10px; font-size: 13px; font-weight: 600; }
    .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .lang-opt { height: 34px; border-radius: 10px; background: var(--soft); box-shadow: var(--shadow); }
    .lang-opt:hover { color: var(--accent); }
    .lang-opt.active { background: var(--btn); color: var(--accent-fg); font-weight: 600; }

    /* 卡片：不画边框，只用一层很淡的阴影 */
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .status { padding: 6px 14px; }
    .row { display: flex; align-items: center; height: 30px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); margin-right: 10px; }
    .row[data-on="1"] .dot { background: var(--ok); }
    .row .state { margin-left: auto; font-size: 12px; color: var(--muted); }
    .row[data-on="1"] .state { color: var(--ok); font-weight: 600; }

    .primary {
      display: block;
      width: 100%;
      height: 38px;
      margin-top: 12px;
      border-radius: 10px;
      background: var(--btn);
      color: var(--accent-fg);
      font-weight: 600;
      box-shadow: var(--btn-shadow);
      transition: filter .12s, transform .12s;
    }
    .primary:hover { filter: brightness(1.05); }
    .primary:active { transform: scale(0.99); }
    .primary:disabled {
      background: var(--soft);
      color: var(--muted);
      box-shadow: none;
      cursor: default;
      filter: none;
      transform: none;
    }
    .secondary {
      display: block;
      margin: 8px auto 0;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .secondary:hover { color: var(--accent); }

    .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .chip {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: left;
      display: flex;
      align-items: center;
      transition: color .12s, background .12s;
    }
    .chip::after { content: "↗"; margin-left: auto; color: var(--muted); font-size: 11px; }
    .chip:hover { color: var(--accent); background: var(--accent-soft); }

    .status { cursor: default; user-select: none; } /* 双击重查，别选中文字 */

    .foot { position: relative; margin-top: 12px; min-height: 26px; display: flex; align-items: center; justify-content: center; }
    footer { text-align: center; font-size: 11px; color: var(--muted); transition: opacity .15s; }
    body.kira #footer { color: var(--ok); cursor: pointer; user-select: none; }

    /* 败者食尘：抖一下 + 闪白 */
    body.bites #main { animation: jk-shake .45s cubic-bezier(.36, .07, .19, .97); } /* 只抖内容区，不抖 body，免得撑出横向滚动条 */
    body.bites::after {
      content: "";
      position: fixed;
      inset: 0;
      background: #fff;
      pointer-events: none;
      animation: jk-flash .65s ease-out forwards;
    }
    @keyframes jk-shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
    @keyframes jk-flash { 0% { opacity: 0; } 25% { opacity: .9; } 100% { opacity: 0; } }
    .foot.toasting #footer { opacity: 0; }

    /* 提示：底部原位置的立体字 */
    #toast {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #a78bfa;
      text-shadow: 1px 1px 0 #8b5cf6, 2px 2px 0 #7c3aed, 3px 3px 0 #6d28d9, 4px 4px 0 #4c1d95, 5px 6px 10px rgba(76, 29, 149, 0.35);
      opacity: 0;
      transform: scale(0.8) skewX(-8deg);
      pointer-events: none;
      transition: opacity .18s, transform .25s cubic-bezier(.2, 1.6, .4, 1);
    }
    body.kira #toast {
      color: #9dffb8;
      text-shadow: 1px 1px 0 #4ade80, 2px 2px 0 #22c55e, 3px 3px 0 #16a34a, 4px 4px 0 #14532d, 5px 6px 10px rgba(0, 0, 0, 0.5);
    }
    #toast.show { opacity: 1; transform: scale(1) skewX(-8deg); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" />
    <h1 id="title">Jacaranda Key</h1>
    <span id="lastRun" data-i18n="checking">检测中…</span>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="settings" title="设置" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main id="main">
    <div class="card status" id="statusCard" data-i18n-title="dblclickHint" title="双击重新检测">
      <div class="row" id="oktaRow"><span class="dot"></span>Okta<span class="state">—</span></div>
      <div class="row" id="canvasRow"><span class="dot"></span>Canvas<span class="state">—</span></div>
      <div class="row" id="proxyRow"><span class="dot"></span><span data-i18n="proxyPages">图书馆代理页</span><span class="state">0</span></div>
    </div>

    <button class="primary" id="proxyCurrentBtn" data-i18n="proxyBtn">用图书馆代理打开当前页</button>
    <button class="secondary" id="refreshNowBtn" data-i18n="refresh">立即续期</button>

    <div class="chips">
      <button class="chip link" data-url="https://sydney.primo.exlibrisgroup.com/view/action/uresolver.do?operation=resolveService&amp;package_service_id=68343842980005106&amp;institutionId=5106&amp;customerId=5105&amp;VE=true">Westlaw AU</button>
      <button class="chip link" data-url="https://go.openathens.net/redirector/sydney.edu.au?url=https%3A%2F%2Fglobal.factiva.com%2Fsb%2Fdefault.aspx%3Flnep%3Dhp">Factiva</button>
      <button class="chip link" data-url="https://sydney.primo.exlibrisgroup.com/discovery/search?vid=61USYD_INST:sydney" data-i18n="libSearch">图书馆检索</button>
      <button class="chip link" data-url="https://canvas.sydney.edu.au/">Canvas</button>
    </div>

    <div class="foot">
      <footer id="footer" data-i18n="footer">不存储任何账号密码 · 非悉尼大学官方工具</footer>
      <div id="toast"></div>
    </div>
  </main>

  <section id="settings" hidden>
    <div class="card settings-card">
      <div class="label" data-i18n="language">语言</div>
      <div class="langs">
        <button class="lang-opt" data-lang="auto" data-i18n="langAuto">跟随浏览器</button>
        <button class="lang-opt" data-lang="zh">中文</button>
        <button class="lang-opt" data-lang="en">English</button>
        <button class="lang-opt" data-lang="ja">日本語</button>
      </div>
    </div>
    <button class="secondary" id="backBtn" data-i18n="back">返回</button>
  </section>

  <script src="i18n.js"></script>
  <script src="quiet-life.js"></script>
  <script src="popup.js"></script>
</body>
</html>
